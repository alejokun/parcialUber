<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sesión</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2>¿Quieres cerrar sesión?</h2>
    <p>Tu sesión actual se cerrará en este dispositivo.</p>
    <ion-button expand="block" color="dark" (click)="logout()">Cerrar sesión</ion-button>
  </div>
</ion-content>
